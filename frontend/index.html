<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompileX</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <!-- the loading screen's lettering: fetched first, so the name never paints in a stand-in font and then jumps -->
    <link rel="preload" href="/fonts/sora-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html, body { background: #000; margin: 0; }

      /* The loading screen: the two CompileX brackets start together, slide apart, and the name opens up between them. It lives in this
         file so it paints the instant the page opens, before any script has downloaded. The splash (#cx-splash) covers the app while it
         starts and fades once the first page is on screen and the animation has played (src/main.jsx); the app's page-loading fallback
         (src/components/PageLoader.jsx) uses the same markup and these classes. */
      @font-face { font-family: "CX Splash"; src: url("/fonts/sora-latin-wght.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      /* Only transform and opacity move here, so the browser animates it off the main thread and it stays smooth while the app's
         scripts are still starting. The name sits in place the whole time; each bracket rides on a half-width strip that starts slid
         in to the middle (the two meet as one closed shape) and glides out to the ends of the name as the name fades up.
         Timeline: the closed brackets fade in (0 to 0.6 s), open (0.6 to 1.7 s), and the name rises (1.25 to 2.05 s); main.jsx then
         holds the finished mark and fades it all out. */
      .cx-loader { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
      #cx-splash { position: fixed; inset: 0; z-index: 9999; transition: opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1); }
      #cx-splash.cx-gone { opacity: 0; pointer-events: none; }
      #cx-splash.cx-gone .cx-open { transform: scale(1.03); }
      .cx-open { --b: 28px; position: relative; display: inline-flex; align-items: center; padding: 0 calc(var(--b) + 8px); font: 700 36px/1 "CX Splash", "Segoe UI", system-ui, sans-serif;
                 transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1); animation: cx-arrive 0.6s cubic-bezier(0.33, 1, 0.68, 1) backwards; }
      .cx-half { position: absolute; top: 0; bottom: 0; width: 50%; display: flex; align-items: center; animation-duration: 1.1s; animation-delay: 0.6s;
                 animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); animation-fill-mode: backwards; }
      .cx-half.cx-l { left: 0; justify-content: flex-start; animation-name: cx-l; }
      .cx-half.cx-r { right: 0; justify-content: flex-end; animation-name: cx-r; }
      .cx-half svg { display: block; width: var(--b); height: calc(var(--b) * 1.69); overflow: visible; }
      .cx-open path { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      /* the name waits until the brackets have nearly cleared it, then rises, so they never slide across visible letters */
      .cx-word { letter-spacing: -0.01em; color: #fff; white-space: nowrap; animation: cx-word 0.8s 1.25s cubic-bezier(0.33, 1, 0.68, 1) backwards; }
      .cx-x { color: #3DE0FF; }
      .cx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @keyframes cx-arrive { from { opacity: 0; transform: scale(0.92); } }
      /* shut: each strip slid in so its bracket's open end reaches the middle */
      @keyframes cx-l { from { transform: translateX(calc(100% - var(--b) + 4px)); } }
      @keyframes cx-r { from { transform: translateX(calc(-100% + var(--b) - 4px)); } }
      @keyframes cx-word { from { opacity: 0; transform: scale(0.95); } }
      @media (max-width: 420px) { .cx-open { --b: 24px; font-size: 30px; } }
      @media (prefers-reduced-motion: reduce) {
        .cx-open, .cx-half, .cx-word { animation: none; }
        #cx-splash.cx-gone .cx-open { transform: none; }
      }
    </style>
    <!-- The code editor (Monaco) downloads its files from this CDN the first time it opens: start the connection early. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  </head>
  <body>
    <div id="cx-splash" class="cx-loader" role="status" aria-live="polite">
      <div class="cx-open" aria-hidden="true">
        <span class="cx-half cx-l"><svg viewBox="6 9 13 22"><path d="M17 11 8 20l9 9" stroke="#3DE0FF" /></svg></span>
        <span class="cx-word">Compile<span class="cx-x">X</span></span>
        <span class="cx-half cx-r"><svg viewBox="21 9 13 22"><path d="M23 11l9 9-9 9" stroke="#9B7BFF" /></svg></span>
      </div>
      <span class="cx-sr">Loading CompileX</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
