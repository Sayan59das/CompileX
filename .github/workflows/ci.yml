name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      # a real Redis for the shared-state tests (lobbies, limits, locks) and for the two-process check; databases 14 and 15 are the tests' own
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Import check (app boots)
        working-directory: backend
        run: python -c "from app.main import app; print('backend imports OK')"
      - name: Explainer video endpoints
        # Drives a stub renderer, so no manim, ffmpeg or API key is needed.
        run: python backend/tests/test_videogen.py
      - name: Graph and tree diagrams
        # Draws every graph and tree question of the reviewed bank, checks each picture against its data, and recomputes
        # the questions' own answers from what is drawn.
        working-directory: backend
        run: |
          pip install pytest
          pytest tests/test_diagrams.py tests/test_diagrams_older_templates.py tests/test_diagrams_builtin_pool.py tests/test_diagrams_symmetry.py tests/test_diagrams_accuracy.py tests/test_diagrams_dataset_pin.py tests/test_diagrams_hard_templates.py tests/test_diagrams_every_template.py -q
      - name: Built-in question starters
        # Every built-in question must carry a starter whose reader can read the question's own tests, in all five languages
        # (the C starters are compiled with gcc), and the backend's copies of scaffold.py and legacy_typing.py must match
        # the question service's.
        working-directory: backend
        run: |
          pip install pytest
          pytest tests/test_pool_starters.py -q
      - name: Scaling fixes
        # The execution cap, the off-loop remembered diagrams, the issued-questions index and the compose file's question service.
        working-directory: backend
        run: |
          pip install pytest
          pytest tests/test_scaling_phase0.py tests/test_judge.py tests/test_sandbox_hardening.py tests/test_function_harness.py tests/test_judge_deploy.py tests/test_process_sandbox.py -q
      - name: Shared state (lobbies, limits, locks)
        # Every scenario runs against the in-process stand-in and against the real Redis above, so the two cannot drift apart.
        working-directory: backend
        env:
          COMPILEX_TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          pip install pytest
          pytest tests/test_shared_state.py tests/test_lobby_manager.py tests/test_rate_limit.py tests/test_execution_gate.py tests/test_socket_handlers.py tests/test_phase1_wiring.py -q -rs
      - name: Security fixes (live-match sockets, OAuth sign-in, login and password reset)
        # Each test is one attack from the security review played against the real handlers or routes: forged sockets and scores, taking over an account
        # through a provider login, guessing passwords and reset codes in bulk or all at once.
        working-directory: backend
        run: |
          pip install pytest
          pytest tests/test_socket_security.py tests/test_oauth_security.py tests/test_auth_security.py tests/test_reset_email_delivery.py -q
      - name: Two backend processes, one game
        # Starts two real servers on one Redis, plays a lobby across them, kills one mid-game and carries on through the other.
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/14
        run: python tests/two_process_check.py
      - name: Undefined names
        # A name used but never defined or imported only fails when that line runs (or, for a module-level one, when the app starts).
        working-directory: backend
        run: |
          pip install pyflakes
          if python -m pyflakes app | grep -i "undefined name"; then exit 1; fi

  question-service:
    name: Question service
    runs-on: ubuntu-latest
    services:
      # a throwaway database for the pool repository's PostgreSQL test, which is skipped when COMPILEX_TEST_PG_URL is not set
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        # torch is not in requirements.txt; the Dockerfile installs the CPU
        # wheel separately, and the test suite exercises the torch Dataset
        # classes, so CI mirrors the Dockerfile here.
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r question-service/requirements.txt pytest httpx
      - name: Import check (service boots)
        working-directory: question-service
        run: python -c "import main_dynamic; print('question-service imports OK')"
      - name: Tests
        working-directory: question-service
        env:
          COMPILEX_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests -q -rs

  judge-process-mode:
    name: Judge without Docker
    # Builds the image Render runs and starts it the way Render does (unprivileged container, only the capabilities it needs), then runs real programs
    # in five languages and real attacks against it: no network, no secret theft, no escape, limits hold, nothing left behind.
    runs-on: ubuntu-latest
    env:
      JUDGE_TOKEN: ci-only-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f judge/Dockerfile.render -t compilex-judge-process .
      - name: Start it
        run: |
          docker run -d --name judge --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add KILL --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges --tmpfs /tmp:exec,mode=1777,size=256m --memory 512m --memory-swap 512m --pids-limit 512 \
            -e JUDGE_TOKEN -e MAX_CONCURRENT_EXECUTIONS=2 -v "$PWD/judge/checks:/checks:ro" compilex-judge-process
          for i in $(seq 1 40); do
            docker exec judge python -c "import urllib.request,sys; sys.exit(0 if b'\"sandbox\":true' in urllib.request.urlopen('http://127.0.0.1:10000/health').read() else 1)" && break
            sleep 2
          done
          docker exec judge python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:10000/health').read().decode())"
      - name: Real programs in five languages
        run: docker exec -e JUDGE_TOKEN judge python /checks/judge_e2e.py http://127.0.0.1:10000
      - name: Attacks on the sandbox
        run: docker exec -e JUDGE_TOKEN judge python /checks/process_security_e2e.py http://127.0.0.1:10000
      - name: Show the judge's log if anything failed
        if: failure()
        run: docker logs judge | tail -60

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Undefined identifiers
        # An icon or helper that is used but never imported still builds, and then crashes the page when it is opened.
        working-directory: frontend
        run: |
          npm install --no-save --no-package-lock eslint@8.57.0 eslint-plugin-react@7.34.1
          npx eslint --no-eslintrc -c eslint.undef.json --ext .js,.jsx src
