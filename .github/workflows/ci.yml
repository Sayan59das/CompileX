name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Import check (app boots)
        working-directory: backend
        run: python -c "from app.main import app; print('backend imports OK')"
      - name: Explainer video endpoints
        # Drives a stub renderer, so no manim, ffmpeg or API key is needed.
        run: python backend/tests/test_videogen.py

  question-service:
    name: Question service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        # torch is not in requirements.txt; the Dockerfile installs the CPU
        # wheel separately, and the test suite exercises the torch Dataset
        # classes, so CI mirrors the Dockerfile here.
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r question-service/requirements.txt pytest httpx
      - name: Import check (service boots)
        working-directory: question-service
        run: python -c "import main_dynamic; print('question-service imports OK')"
      - name: Tests
        working-directory: question-service
        run: pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
