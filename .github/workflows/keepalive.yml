name: Keep the backend awake

# Render's free web services go to sleep after 15 minutes without a request, and the next visitor then waits about a minute.
# This asks the backend's health address every 10 minutes. GitHub may run scheduled jobs a few minutes late, so an outside
# uptime monitor (for example UptimeRobot, 5 minute interval, same address) is more exact; using both does no harm.
# Only the backend is pinged. The question service is woken by the backend when it is needed.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the health address
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors https://compilex-backend-12kt.onrender.com/health
