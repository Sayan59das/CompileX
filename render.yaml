services:
  # Backend API Service
  - type: web
    name: compilex-backend
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend/
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: compilex-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: compilex08@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: compilex08@gmail.com
      - key: SMTP_FROM_NAME
        value: CompileX
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # the public URL of the compilex-ai service below, e.g. https://compilex-ai.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      # Players' code runs in the compilex-judge service below, never in this one. The secret is shared between the two by Render itself.
      - key: JUDGE_TOKEN
        fromService:
          type: web
          name: compilex-judge
          envVarKey: JUDGE_TOKEN
      # the public URL of the compilex-judge service, e.g. https://compilex-judge.onrender.com
      - key: JUDGE_URL
        sync: false

  # Question service (serves the questions the backend asks for)
  - type: web
    name: compilex-ai
    plan: free
    env: docker
    dockerfilePath: ./question-service/Dockerfile
    dockerContext: ./question-service/
    envVars:
      - key: PORT
        value: 10000

  # The judge: runs players' code. Render cannot run Docker, so this image (judge/Dockerfile.render) sandboxes each run as an unprivileged
  # throwaway user with limits and no internet sockets. It is weaker than a Docker judge, and it holds no secret except its own JUDGE_TOKEN.
  - type: web
    name: compilex-judge
    plan: free
    env: docker
    dockerfilePath: ./judge/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: JUDGE_TOKEN
        generateValue: true
      - key: SANDBOX_MODE
        value: process
      - key: MAX_CONCURRENT_EXECUTIONS
        value: 2

databases:
  - name: compilex-db
    plan: free
    databaseName: compilex
    user: compilex
