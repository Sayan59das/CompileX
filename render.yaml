services:
  # Backend API Service
  - type: web
    name: compilex-backend
    plan: free
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend/
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: compilex-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: compilex08@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: compilex08@gmail.com
      - key: SMTP_FROM_NAME
        value: CompileX
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # the public URL of the compilex-ai service below, e.g. https://compilex-ai.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      # NOTE: Render cannot run Docker sandboxes. With DEBUG False the API refuses to run players' code ("temporarily unavailable"),
      # so questions, lobbies and scores work but Run/Submit do not until code execution is moved to a machine with Docker (Phase 2).

  # Question service (serves the questions the backend asks for)
  - type: web
    name: compilex-ai
    plan: free
    env: docker
    dockerfilePath: ./question-service/Dockerfile
    dockerContext: ./question-service/
    envVars:
      - key: PORT
        value: 10000

databases:
  - name: compilex-db
    plan: free
    databaseName: compilex
    user: compilex
